<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Flashcards – Se présenter</title><style>:root{--c:#c28a00}
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f6f3ea;color:#222}
header{background:var(--c);color:#fff;padding:14px 18px} header h1{margin:0;font-size:1.3em} header p{margin:4px 0 0;opacity:.9}
main{max-width:720px;margin:0 auto;padding:16px}
.carte{background:#fff;border-radius:16px;box-shadow:0 3px 10px #0002;padding:20px;margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;margin:6px 4px 0 0;cursor:pointer;background:var(--c);color:#fff}
button.gris{background:#888} button:disabled{opacity:.4}
textarea,input[type=text]{width:100%;font:inherit;font-size:1.1em;padding:10px;border:2px solid #ccc;border-radius:10px}
.barre{height:10px;background:#ddd;border-radius:5px;overflow:hidden} .barre div{height:100%;background:var(--c);transition:width .3s}
.ok{color:#1b7f3b} .ko{color:#c5221f} .expl{background:#fff8dc;border-left:5px solid #e0b000;padding:10px 12px;border-radius:8px;margin-top:10px}

.recto{font-size:1.35em;font-weight:600;min-height:3em} .verso{border-top:3px dashed #ddd;margin-top:14px;padding-top:12px;font-size:1.2em}
.note button{flex:1;min-width:30%} .note{display:flex;gap:6px;flex-wrap:wrap} .su{background:#1b7f3b}.moitie{background:#e09000}.pas{background:#c5221f}
.ta{color:#555;font-style:italic} .info{color:#666;font-size:.9em}
</style></head><body>
<header><h1>🃏 Flashcards – Se présenter</h1><p>Allemand · réponds <b>avant</b> de retourner la carte (à voix haute ou en écrivant), puis sois honnête avec toi-même !</p></header>
<main><div class="barre"><div id="prog" style="width:0"></div></div><p class="info" id="info"></p><div id="zone"></div></main>
<script>
const C = [{"q": "Comment demandes-tu en allemand : « Comment t'appelles-tu ? » ?", "r": "<b>Wie heißt du?<\/b><br>Avec du, heißen prend seulement -t (pas -st), car le ß fait déjà le son s.", "notion": "questions de présentation"}, {"q": "Comment réponds-tu en allemand : « Je m'appelle Elouan. » (deux façons) ?", "r": "<b>Ich heiße Elouan.<\/b> ou <b>Mein Name ist Elouan.<\/b><br>Avec ich, le verbe finit par -e.", "notion": "dire son nom"}, {"q": "Comment demandes-tu en allemand : « Quel âge as-tu ? » ?", "r": "<b>Wie alt bist du?<\/b><br>Mot à mot : « Comment vieux es-tu ? ».", "notion": "dire son âge"}, {"q": "Comment dis-tu en allemand : « J'ai onze ans. » ?", "r": "<b>Ich bin elf Jahre alt.<\/b><br>En allemand, on ne dit pas l'âge avec avoir : on le dit avec être (ich bin). Mot à mot : je suis onze ans vieux.", "notion": "dire son âge"}, {"q": "Conjugue le verbe sein (être) avec ich, du, er / sie.", "r": "<b>ich bin · du bist · er / sie / es ist<\/b><br>Ce verbe est irrégulier : il s'apprend par cœur.", "notion": "verbe sein"}, {"q": "Comment demandes-tu en allemand : « Où habites-tu ? » ?", "r": "<b>Wo wohnst du?<\/b> (ou <b>Wo lebst du?<\/b>)<br>Wo = où : la question demande la ville.", "notion": "Wo / Woher"}, {"q": "Comment réponds-tu en allemand : « J'habite à Castanet. » ?", "r": "<b>Ich wohne in Castanet.<\/b><br>Pour la ville, on utilise <i>in<\/i>. Castanet prend une majuscule.", "notion": "Wo / Woher"}, {"q": "Comment demandes-tu en allemand : « D'où viens-tu ? » ?", "r": "<b>Woher kommst du?<\/b><br>Woher = d'où : la question demande le pays d'origine.", "notion": "Wo / Woher"}, {"q": "Comment réponds-tu en allemand : « Je viens de France. » ?", "r": "<b>Ich komme aus Frankreich.<\/b><br>Pour l'origine, on utilise <i>aus<\/i>, et le nom allemand du pays.", "notion": "Wo / Woher"}, {"q": "Quelle est la différence entre « Wo » et « Woher » ?", "r": "<b>Wo<\/b> = où : la ville où j'habite (Ich wohne <i>in<\/i>…).<br><b>Woher<\/b> = d'où : le pays d'où je viens (Ich komme <i>aus<\/i>…).", "notion": "Wo / Woher"}, {"q": "Quelle est la règle du présent au singulier ?", "r": "On enlève <b>-en<\/b> à l'infinitif, puis on ajoute <b>-e<\/b> (ich), <b>-st<\/b> (du), <b>-t<\/b> (er / sie / es).<br>wohnen → ich wohne, du wohnst, er wohnt.", "notion": "présent -e -st -t"}, {"q": "Conjugue kommen (venir) avec ich, du, er.", "r": "<b>ich komme · du kommst · er kommt<\/b>", "notion": "présent -e -st -t"}, {"q": "Conjugue heißen (s'appeler) avec ich, du, er.", "r": "<b>ich heiße · du heißt · er heißt<\/b><br>Avec du, on ajoute seulement -t, car le ß vaut déjà deux s.", "notion": "heißen : du heißt"}, {"q": "Présente Jasper en allemand : il s'appelle Jasper, il a 11 ans, il habite à Langen.", "r": "<b>Er heißt Jasper. Er ist 11 Jahre alt. Er wohnt in Langen.<\/b><br>Pour un garçon, on dit er, et le verbe finit par -t.", "notion": "présenter quelqu'un"}, {"q": "Présente Moya en allemand : elle s'appelle Moya, elle a 11 ans, elle habite à Dreieich.", "r": "<b>Sie heißt Moya. Sie ist 11 Jahre alt. Sie wohnt in Dreieich.<\/b><br>Pour une fille, on dit sie, et le verbe finit aussi par -t.", "notion": "présenter quelqu'un"}, {"q": "Comment dis-tu en allemand : « Il vient de France. » ?", "r": "<b>Er kommt aus Frankreich.<\/b>", "notion": "présenter quelqu'un"}, {"q": "Comment dis-tu en allemand : « Je viens de Turquie. » ?", "r": "<b>Ich komme aus der Türkei.<\/b><br>Le pays a l'article die (die Türkei) : on dit aus <i>der<\/i>. On écrit Türk<b>ei<\/b> : e puis i.", "notion": "aus der + pays"}, {"q": "Comment dis-tu en allemand : « Je viens de Suisse. » ?", "r": "<b>Ich komme aus der Schweiz.<\/b><br>die Schweiz → aus der Schweiz.", "notion": "aus der + pays"}, {"q": "Comment dit-on l'Espagne et le Maroc en allemand ?", "r": "<b>Spanien<\/b> (l'Espagne) et <b>Marokko<\/b> (le Maroc).<br>Pas d'article : aus Spanien, aus Marokko.", "notion": "pays"}, {"q": "Quel pronom utilises-tu avec « lese » ? avec « singst » ? avec « hört » ?", "r": "<b>ich<\/b> lese (-e) · <b>du<\/b> singst (-st) · <b>er / sie<\/b> hört (-t).<br>La terminaison dit qui fait l'action.", "notion": "présent -e -st -t"}, {"q": "Comment se prononce le « ch » de ich, nicht, München ?", "r": "C'est le son <b>[ç]<\/b>, un ch doux et soufflé.<br>Il ne se dit pas comme le « ch » de cheval : ce son-là s'écrit <i>sch<\/i> en allemand.", "notion": "son [ç]"}], MATIERE = "Allemand", LECON = "Se présenter", LECON_ID = "allemand-se-presenter", CLE = 'elouan_cartes_' + LECON_ID;

const ENDPOINT = "https://script.google.com/macros/s/AKfycbxV2UiqgRKyZ1Aq2PlmCBTIhF8Ixk4UIr3Sd-E8LU1rBmNyeLcGWWKrDb95CZeVf_MT/exec", CLE_SITE = "elouan-6e-2026", FILE = 'elouan_envois_en_attente';
function envoyer(ligne) {
  const att = JSON.parse(localStorage.getItem(FILE) || '[]'); att.push(ligne);
  localStorage.setItem(FILE, JSON.stringify(att)); vider();
}
function vider() {
  if (!ENDPOINT) return;
  const att = JSON.parse(localStorage.getItem(FILE) || '[]'); if (!att.length) return;
  fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'},
                   body: JSON.stringify({cle: CLE_SITE, lignes: att})})
    .then(() => localStorage.setItem(FILE, '[]')).catch(() => {});
}
vider();

const JOUR = 864e5, auj = Math.floor(Date.now() / JOUR);
let etat = JSON.parse(localStorage.getItem(CLE) || '{}');      // n° carte -> {ecart, du, t}
function sauver(){localStorage.setItem(CLE, JSON.stringify(etat))}
// Calendrier partagé entre les appareils (maison / école) via le Google Sheet : la note la plus récente gagne
async function charger(){
  if(!ENDPOINT) return;
  try{ const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 6000);
    const r = await fetch(ENDPOINT + '?cle=' + encodeURIComponent(CLE_SITE) + '&lecon=' + encodeURIComponent(LECON_ID), {signal: ctl.signal});
    const d = await r.json();
    for(const k in d) if(C[k] && (!etat[k] || (etat[k].t||0) < (d[k].t||0))) etat[k] = d[k];
    sauver();
  }catch(e){}   // pas de réseau : on garde le calendrier de l'appareil
}
function pousser(cartes){
  if(!ENDPOINT || !Object.keys(cartes).length) return;
  fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({cle: CLE_SITE, calendrier: {lecon: LECON_ID, cartes: cartes}})}).catch(()=>{});
}
const ECARTS = [3, 7, 14, 30], vues = {};
let file = [], faites = 0, total = 0, bilan = {su:0, moitie:0, pas:0};
const zone = document.getElementById('zone');
function demarrer(){
  // cartes dues (jamais vues ou date atteinte), les plus en retard d'abord ; sinon toutes (séance libre)
  let dues = C.map((c,i)=>i).filter(i=>!etat[i]||etat[i].du<=auj).sort((a,b)=>((etat[a]||{du:0}).du)-((etat[b]||{du:0}).du));
  const libre = !dues.length; if(libre) dues = C.map((c,i)=>i).sort(()=>Math.random()-.5);
  file = dues.slice(); total = file.length;
  document.getElementById('info').textContent = libre ? 'Aucune carte à revoir aujourd\'hui : séance libre, pour le plaisir !' : total + ' carte(s) à revoir aujourd\'hui.';
  montrer();
  pousser(etat);   // ce qui a été fait hors connexion rejoint le calendrier partagé
}
function montrer(){
  document.getElementById('prog').style.width = (100*faites/total) + '%';
  if(!file.length) return fin();
  const c = C[file[0]];
  zone.innerHTML = '<div class="carte"><div class="recto">' + c.q + '</div>' +
    '<textarea id="ta" rows="2" placeholder="Ta réponse (tu peux aussi la dire à voix haute)…"></textarea>' +
    '<button onclick="retourner()">🔄 Retourner la carte</button></div>';
}
function retourner(){
  const c = C[file[0]], t = document.getElementById('ta').value.trim();
  zone.innerHTML = '<div class="carte"><div class="recto">' + c.q + '</div>' + (t ? '<p class="ta">Ta réponse : ' + t.replace(/</g,'&lt;') + '</p>' : '') +
    '<div class="verso">' + c.r + '</div><p><b>Alors, tu savais ?</b></p><div class="note">' +
    '<button class="su" onclick="noter(\'su\')">😀 Su</button><button class="moitie" onclick="noter(\'moitie\')">😐 À moitié</button>' +
    '<button class="pas" onclick="noter(\'pas\')">😕 Pas su</button></div></div>';
  window._rep = t;
}
function noter(n){
  const i = file.shift(), c = C[i]; bilan[n]++;
  const e = etat[i] || {ecart: 0};
  vues[i] = (vues[i] || 0) + 1;
  const encore = vues[i] < 3;                                              // 3 passages max par séance : elle reviendra demain
  if(n=='su'){ e.ecart = ECARTS.find(x => x > e.ecart) || 30; faites++; }  // 3 -> 7 -> 14 -> 30 jours
  else if(n=='moitie'){ e.ecart = 3; if(encore) file.push(i); else faites++; }                     // revient en fin de séance
  else { e.ecart = 1; if(encore) file.splice(Math.min(3, file.length), 0, i); else faites++; }     // revient 3 cartes plus loin
  e.du = auj + e.ecart; e.t = Date.now(); etat[i] = e; sauver(); pousser({[i]: e});
  envoyer({date:new Date().toISOString(),matiere:MATIERE,lecon:LECON,format:'flashcard',question:c.q.replace(/<[^>]+>/g,''),
    reponse:window._rep||'(à voix haute)',bonne:c.r.replace(/<[^>]+>/g,''),correct:n=='su'?'oui':n=='moitie'?'à moitié':'non',notion:c.notion||''});
  montrer();
}
function fin(){
  zone.innerHTML = '<div class="carte" style="text-align:center"><p style="font-size:3em;margin:0">🎉</p><h2>Séance terminée !</h2>' +
    '<p>😀 su du premier coup : ' + bilan.su + ' · 😐 à moitié : ' + bilan.moitie + ' · 😕 pas su : ' + bilan.pas + '</p>' +
    '<p>Les cartes difficiles reviendront <b>demain</b>, les autres dans quelques jours. Reviens chaque jour : 5 minutes suffisent !</p>' +
    '<button class="gris" onclick="if(confirm(\'Tout remettre à zéro, sur tous les appareils ?\'))remiseAZero()">Remettre à zéro</button></div>';
}
function remiseAZero(){
  const t = Date.now(); etat = {}; C.forEach((c,i)=>etat[i] = {ecart: 0, du: 0, t: t}); sauver(); pousser(etat);
  setTimeout(()=>location.reload(), 1500);
}
zone.innerHTML = '<div class="carte">⏳ Je récupère tes cartes…</div>';
charger().then(demarrer);
</script></body></html>
