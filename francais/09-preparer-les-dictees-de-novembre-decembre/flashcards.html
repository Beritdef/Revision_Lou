<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Flashcards – Préparer les dictées de novembre-décembre</title><style>:root{--c:#b3412f}
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f6f3ea;color:#222}
header{background:var(--c);color:#fff;padding:14px 18px} header h1{margin:0;font-size:1.3em} header p{margin:4px 0 0;opacity:.9}
main{max-width:720px;margin:0 auto;padding:16px}
.carte{background:#fff;border-radius:16px;box-shadow:0 3px 10px #0002;padding:20px;margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;margin:6px 4px 0 0;cursor:pointer;background:var(--c);color:#fff}
button.gris{background:#888} button:disabled{opacity:.4}
textarea,input[type=text]{width:100%;font:inherit;font-size:1.1em;padding:10px;border:2px solid #ccc;border-radius:10px}
.barre{height:10px;background:#ddd;border-radius:5px;overflow:hidden} .barre div{height:100%;background:var(--c);transition:width .3s}
.ok{color:#1b7f3b} .ko{color:#c5221f} .expl{background:#fff8dc;border-left:5px solid #e0b000;padding:10px 12px;border-radius:8px;margin-top:10px}

.recto{font-size:1.35em;font-weight:600;min-height:3em} .verso{border-top:3px dashed #ddd;margin-top:14px;padding-top:12px;font-size:1.2em}
.note button{flex:1;min-width:30%} .note{display:flex;gap:6px;flex-wrap:wrap} .su{background:#1b7f3b}.moitie{background:#e09000}.pas{background:#c5221f}
.ta{color:#555;font-style:italic} .info{color:#666;font-size:.9em}
</style></head><body>
<header><h1>🃏 Flashcards – Préparer les dictées de novembre-décembre</h1><p>Français · réponds <b>avant</b> de retourner la carte (à voix haute ou en écrivant), puis sois honnête avec toi-même !</p></header>
<main><div class="barre"><div id="prog" style="width:0"></div></div><p class="info" id="info"></p><div id="zone"></div></main>
<script>
const C = [{"q": "Dictée du 12 novembre : complète « Aujourd'hui, tu ___ la chance de faire du parapente ! » Pourquoi ?", "r": "Tu <b>as<\/b> la chance. Le sujet est <i>tu<\/i> : le verbe avoir s'écrit <b>as<\/b>, avec un -s. On n'écrit pas <i>a<\/i> avec <i>tu<\/i>.", "notion": "homophones a/as/à"}, {"q": "Dictée du 12 novembre : comment savoir s'il faut écrire « a » ou « à » ?", "r": "On remplace par <i>avait<\/i>. Si la phrase marche, on écrit <b>a<\/b> sans accent (le verbe avoir). Si la phrase ne marche pas, on écrit <b>à<\/b> avec un accent.", "notion": "homophones a/as/à"}, {"q": "Dictée du 12 novembre : « Tu t'install__ dans le siège. » Quelle terminaison ?", "r": "Tu t'install<b>es<\/b>. Avec <i>tu<\/i>, le verbe finit par -s : tu t'installes.", "notion": "accord sujet-verbe"}, {"q": "Dictée du 12 novembre : écris le mot qui veut dire « ce jour-ci ». Il y a une apostrophe.", "r": "<b>Aujourd'hui<\/b> : a-u-j-o-u-r-d, apostrophe, h-u-i.", "notion": "mots d'usage"}, {"q": "Dictée du 12 novembre : « le siège reli__ à l'aile impos____ ». Écris les deux mots en entier.", "r": "Le siège <b>relié<\/b> (le siège est masculin : pas de -e) à l'aile <b>imposante<\/b> (l'aile est féminin : on ajoute -e).", "notion": "accord dans le GN"}, {"q": "Dictée du 12 novembre : « il a envie de décoll__ » et « aider le vent à soulev__ la voile ». Quelle terminaison ?", "r": "-<b>er<\/b> : décoller, soulever. Le test : « il a envie de <i>prendre<\/i> », « aider le vent à <i>prendre<\/i> » → c'est l'infinitif.", "notion": "terminaisons -er/-é"}, {"q": "Dictée du 19 novembre : comment choisir entre « on » et « ont » ?", "r": "<b>On<\/b> se remplace par <i>il<\/i> (c'est un pronom sujet). <b>Ont<\/b> se remplace par <i>avaient<\/i> (c'est le verbe avoir avec ils ou elles).", "notion": "homophones on/ont"}, {"q": "Dictée du 19 novembre : « Les gymnastes ___ une force incroyable. » On ou ont ?", "r": "<b>ont<\/b>. On peut dire « les gymnastes <i>avaient<\/i> une force incroyable » : c'est le verbe avoir.", "notion": "homophones on/ont"}, {"q": "Dictée du 19 novembre : écris le mot qui veut dire « surpris et admiratif », avec on : « on est impre…. »", "r": "<b>impressionné<\/b> : deux s, deux n, et é à la fin.", "notion": "mots d'usage"}, {"q": "Dictée du 19 novembre : « les figures acrobati___ sur les barres ». Écris le mot en entier.", "r": "<b>acrobatiques<\/b> : <i>figures<\/i> est au pluriel, donc l'adjectif prend un -s. On n'écrit pas -ent, car ce n'est pas un verbe.", "notion": "accord dans le GN"}, {"q": "Dictée du 26 novembre : « Je rêv__ d'avoir une carrière » et « je pren__ des cours ». Quelles terminaisons ?", "r": "Je rêv<b>e<\/b> (verbe en -er : -e avec je). Je pren<b>ds<\/b> (prendre n'est pas en -er : -ds avec je).", "notion": "conjugaison avec je"}, {"q": "Dictée du 26 novembre : écris le mot « les con…. » (les autres sportifs d'une course). Rappelle-toi ton erreur !", "r": "<b>concurrents<\/b> : deux c, deux r, et -ents. Tu avais écrit « concurrants » : la fin s'écrit avec <i>e<\/i>.", "notion": "mots d'usage"}, {"q": "Dictée du 26 novembre : écris l'adverbe qui veut dire « de façon sérieuse », et celui qui veut dire « de façon régulière ».", "r": "<b>sérieusement<\/b> et <b>régulièrement<\/b> : on ajoute -ment à l'adjectif au féminin (sérieuse → sérieusement, régulière → régulièrement).", "notion": "mots d'usage"}, {"q": "Dictée du 3 décembre : quelle est la terminaison d'un verbe conjugué avec « vous » ? Donne deux exemples du texte.", "r": "-<b>ez<\/b> : vous avancez, vous voyez, vous observez, vous partez, vous voulez.", "notion": "conjugaison avec vous"}, {"q": "Dictée du 3 décembre : « vous voulez partag__ un bon moment et vous amus__ ». -ez ou -er ?", "r": "-<b>er<\/b> les deux fois : partager, amuser. Après « vous voulez », le verbe est à l'infinitif (« vous voulez <i>prendre<\/i> »). On n'écrit pas -ez, car ces verbes ne sont pas conjugués.", "notion": "terminaisons -er/-ez"}, {"q": "Dictée du 3 décembre : écris « de magnifi___ paysage_ » en entier.", "r": "de <b>magnifiques paysages<\/b> : le nom est au pluriel (de… paysages), donc le nom et l'adjectif prennent un -s.", "notion": "accord dans le GN"}, {"q": "Dictée du 10 décembre : « l'escrime serv___ à se défendre quand il y av___ des duels ». Quelle terminaison ?", "r": "-<b>ait<\/b> : servait, avait. C'est l'imparfait avec <i>il<\/i> ou <i>elle<\/i> (l'escrime).", "notion": "imparfait"}, {"q": "Dictée du 10 décembre : « on se protég___ ». Écris le verbe à l'imparfait.", "r": "on se <b>protégeait<\/b> : on garde le <b>e<\/b> après le g pour que le g reste doux devant -ait.", "notion": "imparfait"}, {"q": "Dictée du 10 décembre : « Après, elle est deven__ une activité sans danger. » (elle = l'escrime)", "r": "elle est <b>devenue<\/b> : après le verbe être, le mot s'accorde avec le sujet. <i>Elle<\/i> est féminin, donc on ajoute -e.", "notion": "accord avec être"}, {"q": "Dictée du 10 décembre : « Ils esquivent ___ adversaire. » Leur ou leurs ?", "r": "<b>leur<\/b> adversaire : il n'y a qu'un adversaire, le nom est au singulier, donc <i>leur<\/i> ne prend pas de -s.", "notion": "leur/leurs"}, {"q": "Dictée du 5 novembre : « Gaston et moi échang__ons ». Pourquoi y a-t-il un e après le g ?", "r": "nous échang<b>e<\/b>ons : le e garde le g doux (« je ») devant -ons. Sans le e, on lirait « échang-gons ».", "notion": "verbes en -ger"}, {"q": "Dictée du 5 novembre : « Nous privilégi__ le service en diagonale. » Faut-il un e ?", "r": "Non : nous <b>privilégions<\/b>. Le verbe est <i>privilégier<\/i> : après le g vient un i, et le g est déjà doux devant i.", "notion": "verbes en -ger"}, {"q": "Dictée du 19 novembre : « mais les garçons aussi ___ plaisir à le pratiquer ». Écris le mot qui manque.", "r": "<b>ont<\/b> : « les garçons <i>avaient<\/i> plaisir » marche, c'est le verbe avoir avec <i>les garçons<\/i> (ils).", "notion": "homophones on/ont"}], MATIERE = "Français", LECON = "Préparer les dictées de novembre-décembre", LECON_ID = "francais-preparer-les-dictees-de-novembre-decembre", CLE = 'elouan_cartes_' + LECON_ID;

const ENDPOINT = "https://script.google.com/macros/s/AKfycbxV2UiqgRKyZ1Aq2PlmCBTIhF8Ixk4UIr3Sd-E8LU1rBmNyeLcGWWKrDb95CZeVf_MT/exec", CLE_SITE = "elouan-6e-2026", FILE = 'elouan_envois_en_attente';
function envoyer(ligne) {
  const att = JSON.parse(localStorage.getItem(FILE) || '[]'); att.push(ligne);
  localStorage.setItem(FILE, JSON.stringify(att)); vider();
}
function vider() {
  if (!ENDPOINT) return;
  const att = JSON.parse(localStorage.getItem(FILE) || '[]'); if (!att.length) return;
  fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'},
                   body: JSON.stringify({cle: CLE_SITE, lignes: att})})
    .then(() => localStorage.setItem(FILE, '[]')).catch(() => {});
}
vider();

const JOUR = 864e5, auj = Math.floor(Date.now() / JOUR);
let etat = JSON.parse(localStorage.getItem(CLE) || '{}');      // n° carte -> {ecart, du, t}
function sauver(){localStorage.setItem(CLE, JSON.stringify(etat))}
// Calendrier partagé entre les appareils (maison / école) via le Google Sheet : la note la plus récente gagne
async function charger(){
  if(!ENDPOINT) return;
  try{ const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 6000);
    const r = await fetch(ENDPOINT + '?cle=' + encodeURIComponent(CLE_SITE) + '&lecon=' + encodeURIComponent(LECON_ID), {signal: ctl.signal});
    const d = await r.json();
    for(const k in d) if(C[k] && (!etat[k] || (etat[k].t||0) < (d[k].t||0))) etat[k] = d[k];
    sauver();
  }catch(e){}   // pas de réseau : on garde le calendrier de l'appareil
}
function pousser(cartes){
  if(!ENDPOINT || !Object.keys(cartes).length) return;
  fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({cle: CLE_SITE, calendrier: {lecon: LECON_ID, cartes: cartes}})}).catch(()=>{});
}
const ECARTS = [3, 7, 14, 30], vues = {};
let file = [], faites = 0, total = 0, bilan = {su:0, moitie:0, pas:0};
const zone = document.getElementById('zone');
function demarrer(){
  // cartes dues (jamais vues ou date atteinte), les plus en retard d'abord ; sinon toutes (séance libre)
  let dues = C.map((c,i)=>i).filter(i=>!etat[i]||etat[i].du<=auj).sort((a,b)=>((etat[a]||{du:0}).du)-((etat[b]||{du:0}).du));
  const libre = !dues.length; if(libre) dues = C.map((c,i)=>i).sort(()=>Math.random()-.5);
  file = dues.slice(); total = file.length;
  document.getElementById('info').textContent = libre ? 'Aucune carte à revoir aujourd\'hui : séance libre, pour le plaisir !' : total + ' carte(s) à revoir aujourd\'hui.';
  montrer();
  pousser(etat);   // ce qui a été fait hors connexion rejoint le calendrier partagé
}
function montrer(){
  document.getElementById('prog').style.width = (100*faites/total) + '%';
  if(!file.length) return fin();
  const c = C[file[0]];
  zone.innerHTML = '<div class="carte"><div class="recto">' + c.q + '</div>' +
    '<textarea id="ta" rows="2" placeholder="Ta réponse (tu peux aussi la dire à voix haute)…"></textarea>' +
    '<button onclick="retourner()">🔄 Retourner la carte</button></div>';
}
function retourner(){
  const c = C[file[0]], t = document.getElementById('ta').value.trim();
  zone.innerHTML = '<div class="carte"><div class="recto">' + c.q + '</div>' + (t ? '<p class="ta">Ta réponse : ' + t.replace(/</g,'&lt;') + '</p>' : '') +
    '<div class="verso">' + c.r + '</div><p><b>Alors, tu savais ?</b></p><div class="note">' +
    '<button class="su" onclick="noter(\'su\')">😀 Su</button><button class="moitie" onclick="noter(\'moitie\')">😐 À moitié</button>' +
    '<button class="pas" onclick="noter(\'pas\')">😕 Pas su</button></div></div>';
  window._rep = t;
}
function noter(n){
  const i = file.shift(), c = C[i]; bilan[n]++;
  const e = etat[i] || {ecart: 0};
  vues[i] = (vues[i] || 0) + 1;
  const encore = vues[i] < 3;                                              // 3 passages max par séance : elle reviendra demain
  if(n=='su'){ e.ecart = ECARTS.find(x => x > e.ecart) || 30; faites++; }  // 3 -> 7 -> 14 -> 30 jours
  else if(n=='moitie'){ e.ecart = 3; if(encore) file.push(i); else faites++; }                     // revient en fin de séance
  else { e.ecart = 1; if(encore) file.splice(Math.min(3, file.length), 0, i); else faites++; }     // revient 3 cartes plus loin
  e.du = auj + e.ecart; e.t = Date.now(); etat[i] = e; sauver(); pousser({[i]: e});
  envoyer({date:new Date().toISOString(),matiere:MATIERE,lecon:LECON,format:'flashcard',question:c.q.replace(/<[^>]+>/g,''),
    reponse:window._rep||'(à voix haute)',bonne:c.r.replace(/<[^>]+>/g,''),correct:n=='su'?'oui':n=='moitie'?'à moitié':'non',notion:c.notion||''});
  montrer();
}
function fin(){
  zone.innerHTML = '<div class="carte" style="text-align:center"><p style="font-size:3em;margin:0">🎉</p><h2>Séance terminée !</h2>' +
    '<p>😀 su du premier coup : ' + bilan.su + ' · 😐 à moitié : ' + bilan.moitie + ' · 😕 pas su : ' + bilan.pas + '</p>' +
    '<p>Les cartes difficiles reviendront <b>demain</b>, les autres dans quelques jours. Reviens chaque jour : 5 minutes suffisent !</p>' +
    '<button class="gris" onclick="if(confirm(\'Tout remettre à zéro, sur tous les appareils ?\'))remiseAZero()">Remettre à zéro</button></div>';
}
function remiseAZero(){
  const t = Date.now(); etat = {}; C.forEach((c,i)=>etat[i] = {ecart: 0, du: 0, t: t}); sauver(); pousser(etat);
  setTimeout(()=>location.reload(), 1500);
}
zone.innerHTML = '<div class="carte">⏳ Je récupère tes cartes…</div>';
charger().then(demarrer);
</script></body></html>
